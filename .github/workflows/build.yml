# Builds MIDI Echo on macOS and Windows, runs the tests and pluginval, and
# uploads each plug-in as a downloadable zip on the run's summary page.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            generator: Xcode
            exe: ""
          - name: Windows
            os: windows-latest
            generator: ""  # let CMake pick the installed Visual Studio
            exe: .exe

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build ${{ matrix.generator && format('-G "{0}"', matrix.generator) || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign for macOS (ad hoc)
        if: runner.os == 'macOS'
        # Apple Silicon refuses to load unsigned code; an ad-hoc signature is
        # enough for local use, though not for Gatekeeper on a downloaded file.
        run: codesign --force --deep --sign - "build/MidiEcho_artefacts/Release/VST3/MIDI Echo.vst3"

      - name: Processor test
        run: build/MidiEchoProcessorTest_artefacts/Release/MidiEchoProcessorTest${{ matrix.exe }}

      - name: Host test (loads the built VST3)
        run: |
          for delay in 0 50 1000; do
            build/MidiEchoHostTest_artefacts/Release/MidiEchoHostTest${{ matrix.exe }} \
              "build/MidiEcho_artefacts/Release/VST3/MIDI Echo.vst3" $delay
          done

      - name: pluginval
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pluginval.zip
            PLUGINVAL=pluginval.app/Contents/MacOS/pluginval
          else
            curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            unzip -q pluginval.zip
            PLUGINVAL=./pluginval.exe
          fi
          "$PLUGINVAL" --strictness-level 5 --skip-gui-tests --validate-in-process \
            --validate "build/MidiEcho_artefacts/Release/VST3/MIDI Echo.vst3"

      - name: Zip plug-in
        run: |
          cd build/MidiEcho_artefacts/Release/VST3
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "MIDI Echo.vst3" "$GITHUB_WORKSPACE/MIDI-Echo-macOS.zip"
          else
            7z a -tzip "$GITHUB_WORKSPACE/MIDI-Echo-Windows.zip" "MIDI Echo.vst3"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Echo-${{ matrix.name }}
          path: MIDI-Echo-*.zip

  # Pushing a tag such as v0.1.0 publishes a GitHub Release with both zips,
  # but only after the macOS and Windows builds and tests have all passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          mv dist/MIDI-Echo-Windows.zip "dist/MIDI-Echo-${VERSION}-Windows.zip"
          mv dist/MIDI-Echo-macOS.zip "dist/MIDI-Echo-${VERSION}-macOS.zip"

          cat > notes.md <<'NOTES'
          MIDI Echo passes MIDI straight through and plays a second copy after a delay you set (0 to 10,000 ms; 0 turns the repeat off). It is a VST3 for REAPER and other hosts, and works from the keyboard with a screen reader. Put it before your instrument in the FX chain.

          ## Windows

          1. Download **MIDI-Echo-@VERSION@-Windows.zip** and extract it.
          2. Copy the whole **MIDI Echo.vst3** folder into `C:\Program Files\Common Files\VST3` (Windows asks for administrator permission).
          3. Rescan plug-ins in your host.

          ## macOS (11 or later, Apple Silicon or Intel)

          1. Download **MIDI-Echo-@VERSION@-macOS.zip** and open it.
          2. Move **MIDI Echo.vst3** into `~/Library/Audio/Plug-Ins/VST3`.
          3. The plug-in is not notarized by Apple, so macOS blocks it until you run this once in Terminal:

             ```
             xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"MIDI Echo.vst3"
             ```
          4. Rescan plug-ins in your host.

          Both builds passed the automated tests and pluginval (strictness level 5) before this release was published.
          NOTES
          sed -i "s/@VERSION@/${VERSION}/g" notes.md

          gh release create "$VERSION" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "MIDI Echo $VERSION" \
            --notes-file notes.md
